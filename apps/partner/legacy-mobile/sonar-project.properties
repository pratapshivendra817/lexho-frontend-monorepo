sonar.projectBaseDir=.
sonar.sources=src
sonar.tests=src
sonar.sourceEncoding=UTF-8

# Treat colocated Jest files as tests so they do not drag down source coverage.
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/**/__tests__/**/*.ts,src/**/__tests__/**/*.tsx
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/**/__tests__/**/*.ts,src/**/__tests__/**/*.tsx

# Reuse Jest coverage for production source files.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info
